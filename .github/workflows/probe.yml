name: probe
on:
  push:
    branches: [probe]
    paths: ["dev/probe_kereby.py", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python dev/probe_kereby.py
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          tar czf probe_out.tgz probe_out && git add -f probe_out.tgz
          git commit -qm "probe results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do git pull --rebase -X theirs -q origin probe && git push -q origin HEAD:probe && exit 0; sleep 5; done

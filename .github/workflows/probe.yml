name: probe
on:
  push:
    branches: [probe]
    paths: ["dev/**", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          for k in 0 1 2 3 4; do timeout 22m python dev/probe.py dev/probe_sites.txt $k/5 $(cat dev/probe_only.txt 2>/dev/null) > probe_log_$k.txt 2>&1 & done; wait
          mkdir -p probe_out; cat probe_log_*.txt > probe_out/log.txt
        continue-on-error: true
      - name: Commit results
        run: |
          echo "::notice::files=$(find probe_out -type f | wc -l) log=$(tail -c 600 probe_out/log.txt | tr '\n' ' ')"
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          tar czf probe_out.tgz probe_out && git add -f probe_out.tgz
          git commit -qm "probe results $(date -u +%FT%TZ)" || exit 0
          for i in 1 2 3; do
            git pull --rebase -q origin probe 2>err.txt && git push -q origin HEAD:probe 2>>err.txt && exit 0
            echo "::warning::push attempt $i: $(tr '\n' ' ' < err.txt | tail -c 900)"; sleep 5
          done
          exit 1

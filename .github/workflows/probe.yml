name: probe
on:
  push:
    branches: [probe]
    paths: ["dev/**", ".github/workflows/probe.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python dev/probe.py dev/probe_sites.txt $(cat dev/probe_only.txt 2>/dev/null)
        continue-on-error: true
      - name: Commit results
        run: |
          git config user.name "probe-bot"; git config user.email "probe-bot@users.noreply.github.com"
          git add -f probe_out
          git commit -m "probe results $(date -u +%FT%TZ)" || exit 0
          git push

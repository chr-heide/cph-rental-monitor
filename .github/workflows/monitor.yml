name: monitor
on:
  schedule:
    - cron: "7,27,47 * * * *"   # every 20 min (GitHub may delay scheduled runs a few minutes)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["R/**", "config/**", ".github/workflows/monitor.yml"]
permissions:
  contents: write
concurrency:
  group: monitor
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env: { LANG: C.UTF-8, LC_ALL: C.UTF-8 }
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with: { use-public-rspm: true }
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: any::httr2, any::rvest, any::jsonlite, any::dplyr, any::stringr, any::purrr, any::readr, any::tibble, any::yaml, any::xml2
      - name: Scrape and alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: Rscript R/monitor.R
      - name: Save log
        run: |
          git config user.name "rental-monitor"; git config user.email "rental-monitor@users.noreply.github.com"
          git add data
          git commit -qm "data $(date -u +%FT%TZ)" || exit 0
          git pull --rebase -q && git push -q
